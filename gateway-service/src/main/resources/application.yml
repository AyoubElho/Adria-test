server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        # Route 1: REST API Account Service
        - id: account-service-rest
          uri: http://localhost:8081
          predicates:
            - Path=/api/accounts/**

        # Route 2: MCP Tool Endpoint Account Service
        - id: account-service-mcp
          uri: http://localhost:8081
          predicates:
            - Path=/account-mcp/**
          filters:
            - RewritePath=/account-mcp(?<segment>/?.*), /mcp$\{segment}

        # Route 3: REST API Transaction Service
        - id: transaction-service-rest
          uri: http://localhost:8082
          predicates:
            - Path=/api/transactions/**

        # Route 4: MCP Tool Endpoint Transaction Service
        - id: transaction-service-mcp
          uri: http://localhost:8082
          predicates:
            - Path=/transaction-mcp/**
          filters:
            - RewritePath=/transaction-mcp(?<segment>/?.*), /mcp$\{segment}

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
