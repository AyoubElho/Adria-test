server.port=8082
spring.application.name=transaction-service

# H2 Database & Console
spring.datasource.url=jdbc:h2:mem:transactiondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# GraphQL
spring.graphql.graphiql.enabled=true
spring.graphql.schema.printer.enabled=true

# Business Config
transaction.max-limit=10000.00
account.service.url=http://localhost:8081

# OpenFeign Configuration
spring.cloud.openfeign.client.config.default.connectTimeout=3000
spring.cloud.openfeign.client.config.default.readTimeout=3000

# Resilience4j Configuration
# Circuit Breaker
resilience4j.circuitbreaker.instances.accountServiceCircuitBreaker.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.accountServiceCircuitBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.accountServiceCircuitBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.accountServiceCircuitBreaker.failureRateThreshold=50.0
resilience4j.circuitbreaker.instances.accountServiceCircuitBreaker.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.accountServiceCircuitBreaker.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.accountServiceCircuitBreaker.automaticTransitionFromOpenToHalfOpenEnabled=true

# Retry
resilience4j.retry.instances.accountServiceRetry.maxAttempts=3
resilience4j.retry.instances.accountServiceRetry.waitDuration=500ms
resilience4j.retry.instances.accountServiceRetry.enableExponentialBackoff=true
resilience4j.retry.instances.accountServiceRetry.exponentialBackoffMultiplier=2
